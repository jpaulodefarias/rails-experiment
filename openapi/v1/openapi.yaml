openapi: 3.0.3
info:
  title: Rails Experiment API
  version: v1
  description: JSON API for user management and health checks.
servers:
  - url: /
x-kafka-events:
  topic: user.events.v1
  key: user.id
  delivery: at-least-once
  schema:
    $ref: '#/components/schemas/UserEvent'
tags:
  - name: Health
  - name: Users
paths:
  /health:
    get:
      tags: [Health]
      summary: Check the application and PostgreSQL
      operationId: getHealth
      responses:
        '200':
          description: Application and database are available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: UP
        '503':
          description: The database check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: DOWN
  /api/v1/users:
    get:
      tags: [Users]
      summary: List users in ascending ID order
      operationId: listUsers
      responses:
        '200':
          description: A list of users, which may be empty.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [Users]
      summary: Create a user
      description: Record a `created` event for publication to Kafka after creation.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              user:
                name: Ana
                email: ana@example.com
      responses:
        '201':
          description: User created. The Location header points to the resource.
          headers:
            Location:
              description: Path to the created user.
              schema:
                type: string
                example: /api/v1/users/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/EmailConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Users]
      summary: Delete all users
      description: Available only in development and test. Records one `deleted` event per removed user. Returns 404 in production.
      operationId: deleteAllUsers
      x-available-environments: [development, test]
      responses:
        '204':
          description: All users were removed, including when the collection was already empty.
        '404':
          $ref: '#/components/responses/RouteNotFound'
  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Numeric user ID.
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Users]
      summary: Retrieve a user
      operationId: getUser
      responses:
        '200':
          description: User found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/UserNotFound'
    put:
      tags: [Users]
      summary: Update the supplied fields of a user
      description: Records an `updated` event after a successful update.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              user:
                name: Bea
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          $ref: '#/components/responses/EmailConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Users]
      summary: Delete a user
      description: Records a `deleted` event with the user's last known data.
      operationId: deleteUser
      responses:
        '204':
          description: User deleted; the response has no body.
        '404':
          $ref: '#/components/responses/UserNotFound'
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
    User:
      type: object
      required: [id, name, email, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Ana
        email:
          type: string
          format: email
          example: ana@example.com
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserEvent:
      type: object
      required: [eventId, action, occurredAt, user]
      properties:
        eventId:
          type: string
          format: uuid
          description: Identifier for consumer deduplication.
        action:
          type: string
          enum: [created, updated, deleted]
        occurredAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
    UserInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          description: Required name; leading and trailing whitespace is removed.
          example: Ana
        email:
          type: string
          format: email
          description: Required, case-insensitively unique email; normalized to lowercase.
          example: ana@example.com
    UserUpdate:
      type: object
      properties:
        name:
          type: string
          example: Bea
        email:
          type: string
          format: email
          example: bea@example.com
    CreateUserRequest:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserInput'
    UpdateUserRequest:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserUpdate'
    Error:
      type: object
      required: [code, message, traceId]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
          format: uuid
          description: Matches the Rails request ID.
        fieldErrors:
          type: object
          description: Present only for validation failures.
          additionalProperties:
            type: array
            items:
              type: string
  responses:
    BadRequest:
      description: Malformed JSON or missing user object.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: BAD_REQUEST
            message: Request body is invalid
            traceId: 00000000-0000-0000-0000-000000000000
    UserNotFound:
      description: User does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: USER_NOT_FOUND
            message: User was not found
            traceId: 00000000-0000-0000-0000-000000000000
    RouteNotFound:
      description: Route unavailable in this environment.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Route was not found
            traceId: 00000000-0000-0000-0000-000000000000
    EmailConflict:
      description: Conflict detected by the unique email index.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: EMAIL_ALREADY_EXISTS
            message: Email is already in use
            traceId: 00000000-0000-0000-0000-000000000000
    ValidationFailed:
      description: Submitted data failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_FAILED
            message: User is invalid
            traceId: 00000000-0000-0000-0000-000000000000
            fieldErrors:
              email: ["can't be blank"]
