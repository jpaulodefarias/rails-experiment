default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USER", "rails") %>
  password: <%= ENV.fetch("DB_PASSWORD", "rails_local_only") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "rails_experiment_development") %>

test:
  <<: *default
  database: rails_experiment_test

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME") %>
  username: <%= ENV.fetch("DB_USER") %>
  password: <%= ENV.fetch("DB_PASSWORD") %>
